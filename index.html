<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench 1.3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2300001c'/%3E%3Crect x='4' y='1' width='6' height='5' fill='%23f38204'/%3E%3Crect x='3' y='8' width='10' height='7' fill='%23f7fbf7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--b:#0055aa;--k:#00001c;--w:#f7fbf7;--o:#f38204}
*{box-sizing:border-box;margin:0;padding:0;cursor:inherit}
html{height:100%;cursor:default}
body{height:100%;overflow:hidden;background:var(--b);font:8px/9px 'Press Start 2P',monospace;-webkit-font-smoothing:none;user-select:none;touch-action:none}
[hidden]{display:none!important}
canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;flex:none}
/* ekran Workbencha: 1 jednostka = 1 piksel hires szeroki, 1 wiersz = 2 piksele wysokie */
#wb{position:absolute;left:0;top:0;transform-origin:0 0;background:var(--b);overflow:hidden}
#dt{position:absolute;left:0;right:0;top:11px;bottom:0;overflow:hidden}
#wins{position:absolute;inset:0;pointer-events:none}
#bar{position:absolute;left:0;right:0;top:0;height:11px;background:var(--w);color:var(--k);display:flex;align-items:center;z-index:100000;white-space:nowrap;border-bottom:1px solid var(--b)}
#tl{flex:1;padding-left:8px;overflow:hidden}
#mn{display:none;flex:1}
#bar.m #tl{display:none}#bar.m #mn{display:flex}
#ck{padding-right:12px}
.mt{display:block;padding:0 8px;height:11px;line-height:11px}
.mt.on{background:var(--k);color:var(--w)}
#dd{position:absolute;top:11px;z-index:100001;background:var(--b);border:1px solid var(--w);padding:1px 0;min-width:130px;color:var(--w)}
.mi{padding:2px 8px;white-space:nowrap}
.mi:hover{background:var(--w);color:var(--b)}
.win{position:absolute;display:flex;flex-direction:column;background:var(--b);pointer-events:auto;overflow:hidden}
.tb{height:10px;flex:none;display:flex;background:var(--b);color:var(--w);overflow:hidden;box-shadow:inset 0 1px var(--w),inset 0 -1px var(--w)}
.win.a .tb,.rq .tb{background:var(--w);color:var(--k);box-shadow:none}
.tt{padding:0 6px;line-height:10px;white-space:nowrap;overflow:hidden;flex:none;max-width:60%}
.hat{flex:1;margin:2px 0;background:var(--hatA) 0 0/2px 2px}
.mid{flex:1;display:flex;min-height:0;border-left:2px solid var(--w)}
.c{flex:1;min-width:0;position:relative;overflow:scroll;scrollbar-width:none}
.c::-webkit-scrollbar{display:none}
.vs{width:16px;flex:none;display:flex;flex-direction:column}
.vt{flex:1;border-left:2px solid var(--w);border-right:2px solid var(--w);position:relative;min-height:0}
.vk{position:absolute;left:2px;width:8px;top:0;height:100%;background:var(--w)}
.bt{height:9px;flex:none;display:flex;border-left:2px solid var(--w)}
.ht{flex:1;border-top:1px solid var(--w);border-bottom:1px solid var(--w);position:relative;min-width:0}
.hk{position:absolute;top:2px;height:3px;left:0;width:100%;background:var(--w)}
.ic{position:absolute;width:100px;text-align:center;color:var(--w)}
.ic canvas{margin:0 auto 3px}
.ic span{display:block;word-break:break-all}
.ic.g{pointer-events:none;opacity:.7;z-index:99999}
.rq{position:absolute;left:calc(50% - 140px);top:40px;width:280px;background:var(--b);color:var(--w);border:1px solid var(--w);z-index:150000}
.rq .tb b{font-weight:400;padding:0 6px;line-height:10px}
.bd{padding:10px;line-height:11px}
.bd p{margin-bottom:8px}
.fs label{display:block;margin-bottom:8px}
.rq input{display:block;width:100%;margin-top:3px;font:inherit;color:var(--k);background:var(--w);border:0;padding:2px 4px;outline:0;user-select:text;cursor:text}
.rq input:focus{box-shadow:0 0 0 1px var(--o)}
.pk{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pk canvas{border:1px solid var(--w);padding:2px}
.bs{display:flex;justify-content:space-around;margin-top:4px}
.bs u{text-decoration:none;border:1px solid var(--w);padding:2px 10px}
.bs u:active{background:var(--w);color:var(--b)}
/* ekran startowy Kickstart: grafiki 1:1 z oryginału */
#boot{position:fixed;inset:0;z-index:200000;background:#401040;transition:opacity .45s;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:640px;height:480px;transform-origin:center}
#stage>*{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;image-rendering:pixelated}
#logo{left:82px;top:103px}#dr{left:442px;top:203px;z-index:3}#fl{left:453px;top:253px;z-index:4}
#led{display:none;left:468px;top:232px;width:8px;height:2px;background:#f38204;z-index:5}
#rom{left:82px;top:285px;font:8px/20px 'Press Start 2P',monospace;color:#e8a787;white-space:pre}

.win:not(.a) .hat{background:var(--hatI) 0 0/2px 2px}
.sy{padding:6px 8px;line-height:11px;color:var(--w)}
.row{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-bottom:6px}
.sg{flex:1;min-width:0;font:inherit;color:var(--k);background:var(--w);border:0;padding:2px 4px;outline:0;user-select:text;cursor:text}
.sg:focus{box-shadow:0 0 0 1px var(--o)}
.bn{text-decoration:none;border:1px solid var(--w);padding:1px 6px;white-space:nowrap;display:inline-block}
.bn:active{background:var(--w);color:var(--b)}
.hd{color:var(--o);font-weight:400;font-size:8px}
h2.hd{margin:2px 0 6px;text-transform:uppercase}h3.hd{margin:8px 0 3px}
.sy p{margin-bottom:5px}
.big{font-size:16px;line-height:20px;color:var(--o)}
.wn{display:flex;gap:10px;align-items:center;margin:4px 0 8px}
.fcs{display:flex;gap:4px}.fc{width:46px;text-align:center}.fc canvas{margin:1px auto}
.lk{color:var(--o)}.lk:hover{background:var(--w);color:var(--b)}
.wk canvas{margin:0 0 6px;border:1px solid var(--w)}
.pp{z-index:150001;width:340px;left:calc(50% - 170px);top:20px}
.pg{display:flex;flex-wrap:wrap;gap:4px;max-height:96px;overflow:auto;scrollbar-color:#f38204 #0055aa;margin-bottom:6px}
.cell{padding:2px;border:1px solid transparent}.cell:hover{border-color:var(--w)}.cell.on{border-color:var(--o)}
.pm{position:absolute;z-index:100002;background:var(--b);border:1px solid var(--w);padding:1px 0;min-width:130px;color:var(--w)}
.sep{border-top:1px solid var(--w);margin:2px 0}.mi.dis{opacity:.45}.mi.dis:hover{background:none;color:var(--w)}
.fcs{flex-wrap:wrap;gap:2px}.fc{width:38px}.wn canvas{margin:0}
.win.sh{height:auto!important}.win.sh .mid,.win.sh .bt{display:none}
.im{margin:0 0 6px}.im canvas{border:1px solid var(--w)}
.ytv{width:160px;height:45px;overflow:hidden;margin-bottom:6px;background:var(--k)}
.yti div{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn.on{background:var(--w);color:var(--b)}.fi{margin-bottom:6px}.fi .dd2{color:var(--o)}
.pt{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#000}.pt iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#000}body.drag iframe{pointer-events:none}
</style>
</head>

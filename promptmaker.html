<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--b:#0055aa;--k:#00001c;--w:#f7fbf7;--o:#f38204;--m:ui-monospace,Menlo,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--b);color:var(--w);font:8px/12px 'Press Start 2P',monospace;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:8px;height:100%;padding:8px}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow:auto}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:6px}
.box{border:2px solid var(--w);padding:6px;min-height:0}
.ttl{background:var(--w);color:var(--k);padding:3px 6px;margin:-6px -6px 6px}
#tabs{display:flex;flex-wrap:wrap;gap:4px;flex:none}
.tab{padding:3px 5px;border:1px solid var(--w);cursor:pointer;white-space:nowrap}.tab.on{background:var(--w);color:var(--b)}
.tab i{font-style:normal;color:var(--o);margin-left:4px}.tab.on i{color:var(--k)}
#pane{flex:1;overflow:auto;scrollbar-color:var(--o) var(--b)}
.ph{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.ph b{color:var(--o);font-weight:400;flex:1;min-width:80px}
.bn{border:1px solid var(--w);padding:3px 6px;cursor:pointer;white-space:nowrap;background:none;color:var(--w);font:inherit}.bn:active,.bn.on{background:var(--w);color:var(--b)}.bn.d{border-color:var(--o);color:var(--o)}
.gh{display:flex;gap:6px;align-items:center;margin:8px 0 4px;color:var(--o)}.gh>span:first-child{flex:1}
.row{display:flex;gap:6px;align-items:flex-start;padding:3px 2px;border-bottom:1px dotted rgba(247,251,247,.35);cursor:pointer}.row:hover{background:rgba(247,251,247,.1)}
.cb{flex:none;width:12px;height:12px;border:2px solid var(--w);margin-top:1px}.row.on .cb{background:var(--o);border-color:var(--w);box-shadow:inset 0 0 0 2px var(--k)}
.row .tx{flex:1;min-width:0}.row .tx b{font-weight:400}
.row .tx small{display:none;font:11px/14px var(--m);opacity:.78;margin-top:2px;word-break:break-word}
.row.open .tx small{display:block}
.row .tx .asg{display:block;font:10px/13px var(--m);color:var(--o);margin-top:2px;word-break:break-word}
.row img{width:40px;height:40px;object-fit:cover;border:1px solid var(--w);flex:none}
.mini{border:1px solid var(--w);padding:1px 4px;color:var(--w);cursor:pointer;flex:none}.mini:hover{background:var(--w);color:var(--b)}
.cbar{display:flex;flex-wrap:wrap;gap:4px;align-items:center;padding:5px;margin-bottom:6px;border:1px solid var(--o);background:rgba(0,0,28,.35)}
.cbar>span{color:var(--o);margin-right:2px}
.cpill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--w);padding:2px 5px;cursor:pointer;background:none;color:var(--w);font:inherit}
.cpill.on{background:var(--o);color:var(--k);border-color:var(--w)}
.cpill img{width:14px;height:14px;object-fit:cover;border:1px solid currentColor}
.cpill i{font-style:normal;opacity:.85}
.srch{display:flex;gap:4px;margin-bottom:6px}.srch input{flex:1}
.sec-box{border-top:1px solid rgba(247,251,247,.4);margin-top:8px;padding-top:6px}
.sec-hdr{display:flex;align-items:center;gap:6px;margin-bottom:4px;color:var(--o);background:rgba(0,0,28,.35);padding:3px 5px;border-left:3px solid var(--o)}
.sec-hdr>span:first-child{flex:1}
input[type=text],textarea,select{font:12px/16px var(--m);background:var(--w);color:var(--k);border:2px solid var(--w);padding:4px 6px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--o)}
#out{flex:1;min-height:90px;resize:none}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slots{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.slot{flex:1;min-width:90px;border:2px dashed var(--w);padding:4px;cursor:pointer;text-align:center}.slot.on{border-style:solid;border-color:var(--o)}
.slot s{display:block;height:18px;margin:3px 0;border:1px solid var(--w);background:transparent}.slot span{display:block;font:11px/13px var(--m)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}.tile{border:2px solid var(--w);cursor:pointer;text-align:center;padding:0 0 3px}.tile s{display:block;height:24px;margin-bottom:3px}.tile span{font:10px/12px var(--m);display:block}
.tile.sel{border-color:var(--o);box-shadow:0 0 0 2px var(--o)}.tile em{font-style:normal;color:var(--o);display:block}
#vars{max-height:96px;overflow:auto;scrollbar-color:var(--o) var(--b)}
.v{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dotted rgba(247,251,247,.35)}.v span:first-child{flex:1;cursor:pointer;font:11px/14px var(--m);word-break:break-word}.v span:first-child:hover{color:var(--o)}
.dlg{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:var(--b);border:2px solid var(--w);width:min(480px,94%);max-height:94%;overflow:auto;box-shadow:6px 6px 0 var(--k)}
.dlg .ttl{margin:0}.dlg .bd{padding:8px}.dlg label{display:block;margin-bottom:8px}.dlg label i{display:block;font-style:normal;margin-bottom:3px;color:var(--o)}
.dlg .bt{display:flex;gap:8px;justify-content:center;padding:0 8px 8px;flex-wrap:wrap}
.dim{opacity:.7;font:11px/14px var(--m)}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div id="tabs"></div>
    <div class="box" id="pane" style="flex:1"></div>
  </div>
  <div class="col">
    <div class="box" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="ttl">Final prompt</div>
      <textarea id="out" spellcheck="false"></textarea>
      <div class="row2" style="margin-top:6px">
        <button class="bn" id="bcopy">Copy</button><button class="bn" id="bsave">Save .txt</button><button class="bn" id="bvar">Save variant</button>
        <button class="bn" id="bfmt">Flat</button><button class="bn" id="breb">Rebuild</button><button class="bn d" id="bclr">Clear all</button>
      </div>
      <input type="text" id="ex" placeholder="extra / own text added at the end…" style="margin-top:6px">
      <div class="dim" id="cnt" style="margin-top:4px"></div>
    </div>
    <div class="box" style="flex:none">
      <div class="ttl">Saved variants</div>
      <div id="vars"></div>
      <div class="row2" style="margin-top:6px"><button class="bn" id="bexp">Backup</button><button class="bn" id="bimp">Restore</button></div>
    </div>
  </div>
</div>
<input type="file" id="fimp" accept="application/json" hidden>

function parts(){
 const out=[];
 COMP.forEach(id=>{
  const c=cat(id);if(!c)return;let p=[];
  if(c.k==='color'){
   const g=D.cg,t=[];
   if(g.a)t.push(g.a.n+' ('+g.a.h+') dominant 60%');
   if(g.b)t.push(g.b.n+' ('+g.b.h+') secondary 30%');
   if(g.c)t.push(g.c.n+' ('+g.c.h+') accent 10%');
   if(t.length)p=[t.join('; ')];
  }else if(id==='char'){
   const chs=nm('char'),blocks=[];
   chs.forEach(ch=>{
    const bits=[descOf(c,ch)],cs=(D.csel&&D.csel[ch.id])||{};
    CHAR_CATS.forEach(cid=>{
     const cc=cat(cid);if(!cc)return;
     const arr=(cs[cid]||[]).map(x=>findItem(cc,x)).filter(Boolean);
     if(!arr.length)return;
     if(cid==='outfit')arr.forEach(i=>bits.push('wearing '+i.d));
     else if(cid==='acc')bits.push('with '+arr.map(i=>descOf(cc,i)).join(', '));
     else arr.forEach(i=>bits.push(descOf(cc,i)));
    });
    blocks.push(bits.join(', '));
   });
   if(blocks.length)p=[blocks.join('; ')];
  }else if(id==='outfit'){
   const chs=nm('char');
   c.g.forEach(g=>g.it.forEach(i=>{
    if(!sel('outfit').includes(i.id))return;
    let who='';
    if(g.gen==='own'){const o=chs.find(x=>x.id===i.c);if(!o)return;who=o.n}
    else if(g.gen==='f'||g.gen==='m')who=chs.filter(x=>x.gen===g.gen).map(x=>x.n).join(' and ');
    p.push((who?who+' ':'')+'wearing '+i.d);
   }));
  }else{
   p=allItems(c).filter(i=>sel(id).includes(i.id)).map(i=>descOf(c,i));
   if(c.k==='loc'&&D.loc.trim())p.push('set in '+D.loc.trim());
  }
  if(p.length)out.push([id,p]);
 });
 return out;
}
function compose(){
 const P=parts(),ex=D.ex.trim();let t;
 if(D.fmt==='flat'){
  const av=P.find(x=>x[0]==='avoid'),main=P.filter(x=>x[0]!=='avoid').flatMap(x=>x[0]==='color'?x[1].map(s=>'color grade: '+s):x[1]);
  t=main.join(', ');
  if(av)t+=(t?'. ':'')+'Avoid: '+av[1].join(', ');
  if(ex)t+=(t?'. ':'')+ex;
 }else{
  t=P.map(([id,p])=>LBL[id]+': '+p.join(', ')).join('\n');
  if(ex)t+=(t?'\n':'')+'Extra: '+ex;
 }
 return t;
}

  const hd=E('div','sec-hdr');hd.append(E('span','',c.n));
  if(c.dual){const m=E('span','mini',{ext:'Ext',int:'Int',both:'Both'}[c.mode||'ext']);m.title='Exterior / interior / both';m.onclick=()=>{c.mode={ext:'int',int:'both',both:'ext'}[c.mode||'ext'];manual=false;save();draw()};hd.append(m)}
  if(c.id==='outfit'){const f=E('span','mini',D.ofAll?'All':'Filtered');f.title='Filter outfits by selected character';f.onclick=()=>{D.ofAll=!D.ofAll;save();draw()};hd.append(f)}
  const bm=E('span','mini',c.s?'1':'Multi');bm.title='Single / Multi selection';bm.onclick=()=>{c.s=c.s?0:1;if(c.s){const s=sel(c.id);s.length=Math.min(s.length,1);if(CHAR_CATS.includes(c.id)&&D.csel)Object.values(D.csel).forEach(m=>{if(m[c.id])m[c.id].length=Math.min(m[c.id].length,1)})}manual=false;save();draw()};hd.append(bm);
  const clr=E('span','mini','Clear');clr.onclick=()=>{if(CHAR_CATS.includes(c.id)&&sel('char').length)getSel(c.id).length=0;else D.sel[c.id]=[];if(c.id==='char')syncActChar();manual=false;save();draw()};hd.append(clr);
  if(c.grp){const ng=E('span','mini','+ Grp');ng.onclick=()=>ask('New group','Group / project name','',n=>{c.g.push({n,it:[]});save();draw()});hd.append(ng)}
  else{const a=E('span','mini','+ Item');a.onclick=()=>itemDlg(c,c.g[0]);hd.append(a)}
  if(c.custom){const dc=E('span','mini','×');dc.title='Delete category';dc.onclick=()=>{if(confirm('Delete category '+c.n+'?')){D.cats.splice(D.cats.indexOf(c),1);delete D.sel[c.id];cur='presets';manual=false;save();draw()}};hd.append(dc)}
  sec.append(hd);

  if(c.k==='loc'&&!ql){
   const li=E('input');li.type='text';li.placeholder='city / country / custom place … e.g. Kielce, Poland';li.value=D.loc;li.style.marginBottom='4px';
   li.oninput=()=>{D.loc=li.value;manual=false;save();renderOut();tabs()};
   sec.append(li);
  }
  const inner=E('div'),cnt=renderCatRows(c,inner);
  if(ql&&!cnt)return;
  totalShown+=cnt;sec.append(inner);secWrap.append(sec);
 });
 if(ql&&!totalShown)secWrap.append(E('div','dim','No matching items.'));
}

/* ---- Presets ---- */
function applyPreset(pr){
 D.sel={};D.csel={};actChar=null;D.loc=pr.loc||'';
 Object.entries(pr.pick||{}).forEach(([cid,names])=>{
  const c=cat(cid);if(!c)return;
  D.sel[cid]=names.map(nmStr=>{
   const it=allItems(c).find(x=>x.n.toLowerCase()===nmStr.toLowerCase());
   return it?it.id:null;
  }).filter(Boolean);
 });
 if(pr.cg&&pr.cg.length===3){
  const findCol=nmStr=>{const q=COLS.concat(D.cc||[]).find(z=>z[0].toLowerCase()===nmStr.toLowerCase());return q?{n:q[0],h:q[1]}:null};
  D.cg={a:findCol(pr.cg[0]),b:findCol(pr.cg[1]),c:findCol(pr.cg[2])};
 }else{D.cg={a:null,b:null,c:null}}
 manual=false;save();draw();
}
function saveUserPreset(){
 ask('Save current setup as preset','Preset name','Custom Hero Preset',n=>{
  const pick={};
  Object.entries(D.sel).forEach(([cid,ids])=>{
   const c=cat(cid);if(!c||!ids.length)return;
   pick[cid]=ids.map(id=>findItem(c,id)).filter(Boolean).map(x=>x.n);
  });
  const cg=[D.cg.a,D.cg.b,D.cg.c].every(Boolean)?[D.cg.a.n,D.cg.b.n,D.cg.c.n]:null;
  D.upresets.unshift({id:uid(),g:'My Custom Presets',n,desc:'Custom saved scene setup ('+Object.keys(pick).length+' categories)',loc:D.loc,pick,cg});
  save();draw();
 });
}
function panePresets(p){
 const hd=E('div','ph');hd.append(E('b','','Scene Presets'));
 const sv=E('button','bn','+ Save current as preset');sv.onclick=saveUserPreset;hd.append(sv);
 p.append(hd);
 const sb=E('div','srch'),si=E('input');si.type='text';si.placeholder='Search presets (e.g. white, black, wood, sparks, ugc)…';si.value=q;
 const sx=E('button','bn','×');sx.hidden=!q;
 si.oninput=()=>{q=si.value;sx.hidden=!q;renderPresetList(wrap)};
 sx.onclick=()=>{q='';si.value='';sx.hidden=true;renderPresetList(wrap);si.focus()};
 sb.append(si,sx);p.append(sb);
 const wrap=E('div');p.append(wrap);renderPresetList(wrap);
}
function renderPresetList(wrap){
 wrap.replaceChildren();
 const ql=q.trim().toLowerCase();
 const all=[...D.upresets,...PRESETS];
 const groups=[...new Set(all.map(x=>x.g))];
 let shown=0;
 groups.forEach(gn=>{
  let list=all.filter(x=>x.g===gn);
  if(ql)list=list.filter(x=>x.n.toLowerCase().includes(ql)||x.desc.toLowerCase().includes(ql));
  if(!list.length)return;
  const gh=E('div','gh');gh.append(E('span','',gn));wrap.append(gh);
  list.forEach(pr=>{
   shown++;
   const isOpen=openId===pr.id,r=E('div','row'+(isOpen?' open':''));
   r.append(E('div','cb'));
   const tx=E('div','tx');tx.append(E('b','',pr.n),E('small','',pr.desc));r.append(tx);
   const ex=E('span','mini',isOpen?'▴':'▾');ex.onclick=e=>{e.stopPropagation();openId=isOpen?null:pr.id;renderPresetList(wrap)};
   r.append(ex);
   if(pr.g==='My Custom Presets'){
    const dl=E('span','mini','×');dl.onclick=e=>{e.stopPropagation();if(confirm('Delete preset '+pr.n+'?')){D.upresets=D.upresets.filter(x=>x.id!==pr.id);save();renderPresetList(wrap)}};
    r.append(dl);
   }
   r.onclick=()=>applyPreset(pr);
   wrap.append(r);
  });
 });
 if(!shown)wrap.append(E('div','dim','No matching presets.'));
}

function draw(){
 tabs();
 const allTabs=[...TABS,...customCats().map(c=>({id:'c_'+c.id,n:c.n,cats:[c.id]}))];
 curTabObj=allTabs.find(t=>t.id===cur)||allTabs[0];
 const p=$('#pane');p.replaceChildren();
 if(curTabObj.k==='presets'){panePresets(p);renderVars();renderOut();return}
 const hd=E('div','ph');hd.append(E('b','',curTabObj.n));p.append(hd);
 if(curTabObj.cbar)charBar(p);
 const sb=E('div','srch'),si=E('input');si.type='text';si.placeholder='Search in '+curTabObj.n.toLowerCase()+'…';si.value=q;
 const sx=E('button','bn','×');sx.title='Clear search';sx.hidden=!q;
 si.oninput=()=>{q=si.value;sx.hidden=!q;renderSections()};
 sx.onclick=()=>{q='';si.value='';sx.hidden=true;renderSections();si.focus()};
 sb.append(si,sx);p.append(sb);
 secWrap=E('div');p.append(secWrap);renderSections();
 renderVars();renderOut();
}

/* ---- warianty ---- */
const snapState=()=>JSON.parse(JSON.stringify({sel:D.sel,csel:D.csel||{},loc:D.loc,cg:D.cg,ex:D.ex,fmt:D.fmt}));
function renderVars(){
 const v=$('#vars');v.replaceChildren();
 if(!D.vars.length){v.append(E('div','dim','No saved variants yet.'));return}
 D.vars.forEach(x=>{
  const r=E('div','v'),n=E('span','',x.n);n.title=x.t;
  n.onclick=()=>{const s=JSON.parse(JSON.stringify(x.st));D.sel=s.sel;D.csel=s.csel||{};D.loc=s.loc;D.cg=s.cg;D.ex=s.ex;D.fmt=s.fmt;$('#ex').value=D.ex;syncActChar();manual=false;save();syncFmt();draw()};
  const cp=E('span','mini','Copy');cp.onclick=()=>copy(x.t);
  const dl=E('span','mini','×');dl.onclick=()=>{if(confirm('Delete variant '+x.n+'?')){D.vars.splice(D.vars.indexOf(x),1);save();renderVars()}};
  r.append(n,cp,dl);v.append(r);
 });
}
$('#bvar').onclick=()=>{const t=$('#out').value.trim();if(!t)return;ask('Save variant','Variant name','Variant '+(D.vars.length+1),n=>{D.vars.unshift({id:uid(),n,t,ts:Date.now(),st:snapState()});save();renderVars()})};

/* ---- przyciski ---- */
function copy(t){
 const done=()=>{const b=$('#bcopy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200)};
 const fb=()=>{const a=E('textarea');a.value=t;a.style.cssText='position:fixed;left:-999px';document.body.append(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb();
}
$('#bcopy').onclick=()=>copy($('#out').value);
const dlf=(name,type,txt)=>{const a=E('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('#bsave').onclick=()=>dlf('prompt.txt','text/plain',$('#out').value);
function syncFmt(){$('#bfmt').textContent=D.fmt==='flat'?'Flat':'Labelled'}
$('#bfmt').onclick=()=>{D.fmt=D.fmt==='flat'?'lab':'flat';manual=false;save();syncFmt();renderOut()};
$('#breb').onclick=()=>{manual=false;renderOut()};
$('#bclr').onclick=()=>{if(confirm('Clear the whole selection?')){D.sel={};D.csel={};actChar=null;D.loc='';D.cg={a:null,b:null,c:null};D.ex='';$('#ex').value='';slot='a';manual=false;save();draw()}};
$('#out').oninput=()=>{manual=true;renderOut()};
$('#ex').oninput=e=>{D.ex=e.target.value;manual=false;save();renderOut()};
$('#bexp').onclick=()=>dlf('promptmaker-backup.json','application/json',JSON.stringify(D));
$('#bimp').onclick=()=>$('#fimp').click();
$('#fimp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.cats)throw 0;if(confirm('Replace all current data with the backup?')){D=o;if(!D.csel)D.csel={};if(!D.upresets)D.upresets=[];save();location.reload()}}catch(x){alert('This is not a Prompt Maker backup file.')}});e.target.value=''};
$('#ex').value=D.ex||'';syncFmt();draw();
</script>

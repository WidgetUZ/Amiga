<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--b:#0055aa;--k:#00001c;--w:#f7fbf7;--o:#f38204;--m:ui-monospace,Menlo,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--b);color:var(--w);font:8px/12px 'Press Start 2P',monospace;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px;height:100%;padding:8px}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow:auto}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:6px}
.box{border:2px solid var(--w);padding:6px;min-height:0}
.ttl{background:var(--w);color:var(--k);padding:3px 6px;margin:-6px -6px 6px}
#tabs{display:flex;flex-wrap:wrap;gap:4px;flex:none}
.tab{padding:3px 5px;border:1px solid var(--w);cursor:pointer;white-space:nowrap}.tab.on{background:var(--w);color:var(--b)}
.tab i{font-style:normal;color:var(--o);margin-left:4px}.tab.on i{color:var(--k)}
#pane{flex:1;overflow:auto;scrollbar-color:var(--o) var(--b)}
.ph{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.ph b{color:var(--o);font-weight:400;flex:1;min-width:80px}
.bn{border:1px solid var(--w);padding:3px 6px;cursor:pointer;white-space:nowrap;background:none;color:var(--w);font:inherit}.bn:active,.bn.on{background:var(--w);color:var(--b)}.bn.d{border-color:var(--o);color:var(--o)}
.gh{display:flex;gap:6px;align-items:center;margin:8px 0 4px;color:var(--o)}.gh span{flex:1}
.row{display:flex;gap:6px;align-items:flex-start;padding:3px 2px;border-bottom:1px dotted rgba(247,251,247,.35);cursor:pointer}.row:hover{background:rgba(247,251,247,.1)}
.cb{flex:none;width:12px;height:12px;border:2px solid var(--w);margin-top:1px}.row.on .cb{background:var(--o);border-color:var(--w);box-shadow:inset 0 0 0 2px var(--k)}
.row .tx{flex:1;min-width:0}.row .tx b{font-weight:400}.row .tx small{display:block;font:11px/14px var(--m);opacity:.75;margin-top:2px;word-break:break-word}
.row img{width:34px;height:34px;object-fit:cover;image-rendering:pixelated;border:1px solid var(--w);flex:none}
.mini{border:1px solid var(--w);padding:1px 4px;color:var(--w);cursor:pointer;flex:none}.mini:hover{background:var(--w);color:var(--b)}
input[type=text],textarea,select{font:12px/16px var(--m);background:var(--w);color:var(--k);border:2px solid var(--w);padding:4px 6px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--o)}
#out{flex:1;min-height:90px;resize:none}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slots{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.slot{flex:1;min-width:90px;border:2px dashed var(--w);padding:4px;cursor:pointer;text-align:center}.slot.on{border-style:solid;border-color:var(--o)}
.slot s{display:block;height:18px;margin:3px 0;border:1px solid var(--w);background:transparent}.slot span{display:block;font:11px/13px var(--m)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}.tile{border:2px solid var(--w);cursor:pointer;text-align:center;padding:0 0 3px}.tile s{display:block;height:24px;margin-bottom:3px}.tile span{font:10px/12px var(--m);display:block}
.tile.sel{border-color:var(--o);box-shadow:0 0 0 2px var(--o)}.tile em{font-style:normal;color:var(--o);display:block}
#vars{max-height:96px;overflow:auto;scrollbar-color:var(--o) var(--b)}
.v{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dotted rgba(247,251,247,.35)}.v span:first-child{flex:1;cursor:pointer;font:11px/14px var(--m);word-break:break-word}.v span:first-child:hover{color:var(--o)}
.dlg{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:var(--b);border:2px solid var(--w);width:min(480px,94%);max-height:94%;overflow:auto;box-shadow:6px 6px 0 var(--k)}
.dlg .ttl{margin:0}.dlg .bd{padding:8px}.dlg label{display:block;margin-bottom:8px}.dlg label i{display:block;font-style:normal;margin-bottom:3px;color:var(--o)}
.dlg .bt{display:flex;gap:8px;justify-content:center;padding:0 8px 8px;flex-wrap:wrap}
.dim{opacity:.7;font:11px/14px var(--m)}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div id="tabs"></div>
    <div class="box" id="pane" style="flex:1"></div>
  </div>
  <div class="col">
    <div class="box" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="ttl">Final prompt</div>
      <textarea id="out" spellcheck="false"></textarea>
      <div class="row2" style="margin-top:6px">
        <button class="bn" id="bcopy">Copy</button><button class="bn" id="bsave">Save .txt</button><button class="bn" id="bvar">Save variant</button>
        <button class="bn" id="bfmt">Flat</button><button class="bn" id="breb">Rebuild</button><button class="bn d" id="bclr">Clear all</button>
      </div>
      <input type="text" id="ex" placeholder="extra / own text added at the end…" style="margin-top:6px">
      <div class="dim" id="cnt" style="margin-top:4px"></div>
    </div>
    <div class="box" style="flex:none">
      <div class="ttl">Saved variants</div>
      <div id="vars"></div>
      <div class="row2" style="margin-top:6px"><button class="bn" id="bexp">Backup</button><button class="bn" id="bimp">Restore</button></div>
    </div>
  </div>
</div>
<input type="file" id="fimp" accept="application/json" hidden>
<script>
const $=s=>document.querySelector(s),E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let un=0;const uid=()=>'i'+Date.now().toString(36)+(un++).toString(36)+Math.random().toString(36).slice(2,4);
const C=(id,n,arr,o)=>Object.assign({id,n,k:'list',g:[{n:'',it:arr.map(a=>({id:uid(),n:a[0],d:a[1]}))}]},o||{});
const D0=()=>({v:1,sel:{},loc:'',cg:{a:null,b:null,c:null},ex:'',fmt:'flat',vars:[],cats:[
C('type','Type',[['movie','cinematic feature film still, high production value'],['fashion photography','high-end fashion photography editorial, magazine-quality styling'],['product hero photography','product hero photography, premium commercial advertising shot, flawless showcase of the product'],['puppet doll theatre','puppet doll theatre, handcrafted puppets on a miniature stage, felt and fabric textures, visible rods and strings'],['pixar style cartoon','Pixar-style 3D animated cartoon, expressive characters, soft subsurface shading, warm cinematic lighting'],['manga','black-and-white manga illustration, bold ink linework, screentone shading, dynamic composition'],['anime','anime style, cel-shaded characters, vibrant colors, detailed painted backgrounds'],['noir','film noir, high-contrast black-and-white, deep shadows, smoky atmosphere'],['tv show','TV series episode frame, broadcast television look, polished 16:9 composition']]),
C('cam','Camera settings',[['imax','shot on IMAX large-format camera, ultra-high resolution, immersive scale'],['shallow depth of field','shallow depth of field, creamy bokeh, subject sharply isolated'],['wide angle','wide-angle lens, expansive field of view, slight perspective distortion'],['hand held','handheld camera, subtle natural shake, documentary feel'],['steady cam','smooth Steadicam movement following the subject'],['fpv drone fly over','FPV drone fly-over, fast fluid aerial movement skimming over the scene'],['spin','spinning camera rotation, dizzying 360-degree twirl'],['tilt up','camera slowly tilts up, revealing the scene from bottom to top'],['tilt down','camera slowly tilts down, revealing the scene from top to bottom'],['span around','camera sweeps around the subject in a smooth orbit'],['macro shot','macro shot, tiny details in razor-sharp focus'],['extreme close up','extreme close-up filling the frame with fine detail'],['close up','close-up shot, emotive detail']]),
C('frame','Shot framing',[['establishing shot','wide establishing shot showing the full environment'],['medium shot','medium shot, subject framed from the waist up'],['full body','full-body shot, subject entirely in frame'],['over the shoulder','over-the-shoulder shot'],['low angle','low-angle shot looking up, heroic perspective'],['high angle','high-angle shot looking down'],['top-down','top-down overhead view'],['dutch angle','tilted dutch angle, unsettling tension'],['POV','first-person point-of-view shot'],['symmetrical','perfectly symmetrical centered composition']]),
C('lens','Lens',[['24mm','24mm lens'],['35mm','35mm lens, natural wide perspective'],['50mm','50mm lens, natural perspective'],['85mm portrait','85mm portrait lens, flattering compression'],['anamorphic','anamorphic lens, horizontal flares and oval bokeh'],['fisheye','fisheye lens, strong barrel distortion'],['telephoto','telephoto lens, compressed background']]),
C('aes','Aesthetic',[['war movie','gritty war movie aesthetic, desaturated tones, dust and smoke, battle-worn textures'],['arizona','Arizona southwest landscape, red rock mesas, saguaro cacti, dusty desert highways'],['florida','Florida subtropical vibe, pastel buildings, palm trees, humid coastal light'],['texas','Texas heartland aesthetic, wide plains, ranches, dusty roads, Americana'],['art deco','Art Deco design, geometric patterns, gold and black ornamentation, streamlined glamour'],['brutalist','brutalist architecture, raw concrete monoliths, stark geometry'],['sci-fi','science fiction aesthetic, futuristic technology, sleek surfaces, holographic displays'],['retro','retro 1980s aesthetic, analog gadgets, neon accents, nostalgic design'],['vintage','vintage mid-century look, faded tones, aged materials, nostalgic atmosphere'],['metropolis','sprawling futuristic metropolis, towering skyscrapers, dense vertical city'],['antarctic','Antarctic polar landscape, endless ice, blue glaciers, stark white emptiness'],['winter','winter season, snow, bare trees, frosty air'],['spring','spring season, blossoming trees, fresh green growth, soft light'],['summer','summer season, lush greenery, bright warm days'],['autumn','autumn season, falling orange leaves, golden foliage, crisp air'],['desert','vast desert, rolling dunes, heat haze, sun-bleached colors']]),
C('mood','Mood',[['tense','tense, suspenseful mood'],['dreamy','dreamy, ethereal mood'],['melancholic','melancholic, quiet mood'],['epic','epic, grand mood'],['playful','playful, lighthearted mood'],['eerie','eerie, unsettling mood'],['cozy','warm, cozy, intimate mood'],['gritty','gritty, raw, realistic mood'],['luxurious','luxurious, elegant, premium mood']]),
C('weather','Weather',[['sunny','clear sunny weather, bright sun, crisp shadows'],['cloudy','overcast cloudy sky, soft diffused light'],['fog','thick fog, low visibility, atmospheric depth'],['mist','light mist drifting in the air, soft haze'],['humidity','humid air, damp surfaces, heavy atmosphere, glistening skin'],['rainy','rain falling, wet reflective surfaces, puddles'],['snowy','snowfall, snow-covered surroundings'],['windy','strong wind, moving hair and clothing, swaying trees'],['freezing','freezing temperatures, visible breath, frost on surfaces'],['cold','cold crisp weather, cool tones'],['warm','warm pleasant weather, soft golden warmth'],['hot','scorching heat, heat haze, shimmering air']]),
C('time','Time of day',[['night','nighttime, dark sky, deep shadows, artificial light sources'],['late afternoon','late afternoon, low warm sun, long shadows'],['noon','midday, high sun, strong overhead light'],['morning','early morning, fresh soft light, gentle haze'],['blue hour','blue hour twilight, deep blue sky'],['dawn','dawn, first light on the horizon']],{s:1}),
C('light','Light set up',[['dramatic studio','dramatic studio lighting, strong key light, deep contrast, controlled shadows'],['dramatic outdoor','dramatic outdoor lighting, strong directional natural light, high contrast'],['street lights','street lights casting pools of sodium-vapor glow'],['studio 3 point lights','classic three-point studio lighting: key, fill and rim light'],['sun only','natural sunlight only, no artificial lights'],['moonlight only','lit only by cool silver moonlight'],['indoor light','warm indoor practical lighting, lamps and ambient interior glow'],['light beam','visible volumetric light beam cutting through the atmosphere, god rays'],['light leak','analog film light leaks, warm orange flare along the edges'],['golden hour','golden hour, warm low-angle sunlight, soft glow, long shadows']]),
{id:'color',n:'Color grade',k:'color',g:[]},
{id:'loc',n:'Location',k:'loc',g:[]},
{id:'char',n:'Character',k:'list',grp:1,g:[{n:'Project 1',it:[]}]},
C('act','Action',[['sitting','sitting calmly'],['running','running at full speed, dynamic motion'],['walking','walking steadily'],['fighting','fighting, intense physical combat'],['holding','holding {item} in hand, product clearly visible'],['climbing','climbing, hands gripping the surface'],['upstairs','walking upstairs'],['lifting weights','lifting heavy weights, strained muscles'],['jumping','jumping in mid-air'],['skateboarding','skateboarding, mid-trick'],['swimming','swimming, water splashing'],['sneaking','sneaking quietly, careful steps'],['hiding','hiding, peeking from cover'],['looking after','looking after someone or something with a watchful, protective gaze']]),
{id:'item',n:'Item',k:'list',grp:1,g:[
 {n:'Filtering jugs',it:[['Prisma','Prisma water filtering jug'],['Crystal','Crystal water filtering jug'],['Atria','Atria water filtering jug'],['Luna','Luna water filtering jug']].map(a=>({id:uid(),n:a[0],d:a[1]}))},
 {n:'Water filtering bottles',it:[['Soft','Soft water filtering bottle'],['Solid','Solid water filtering bottle'],['Solid Steel','Solid Steel water filtering bottle']].map(a=>({id:uid(),n:a[0],d:a[1]}))},
 {n:'Thermal',it:[['Switch Duo','Switch Duo thermal bottle'],['Easy','Easy thermal bottle']].map(a=>({id:uid(),n:a[0],d:a[1]}))}]},
C('logo','Logo',[['dafi','Dafi brand logo'],['wodostacja','Wodostacja brand logo'],['flow comfort','Flow Comfort brand logo']]),
C('logoact','What logo does',[['embroidered on hat','logo embroidered on a cap, visible stitched thread detail'],['embroidered on sleeve','logo embroidered on the sleeve'],['embroidered on chest','logo embroidered on the chest'],['embroidered on shoes','logo embroidered on the shoes'],['printed all around clothing','logo repeated as an all-over print pattern on the clothing'],['printed all around hat','logo repeated as an all-over print pattern on the hat'],['printed all around shoes','logo repeated as an all-over print pattern on the shoes']]),
C('other','Other',[['subtle texture imperfections','subtle texture imperfections, natural surface detail, not overly clean'],['bad tv warp','bad TV warp, wobbling CRT distortion, scanline glitches'],['VHS quality','VHS tape quality, tracking noise, soft color bleed, analog grain'],['4K','4K ultra-sharp resolution'],['film grain','35mm film grain'],['halation','halation glow around bright highlights'],['lens flare','cinematic lens flare'],['motion blur','natural motion blur']]),
C('ratio','Aspect ratio',[['16:9','aspect ratio 16:9'],['9:16','vertical aspect ratio 9:16'],['21:9','ultra-wide aspect ratio 21:9'],['1:1','square aspect ratio 1:1'],['4:5','portrait aspect ratio 4:5']],{s:1}),
C('avoid','Avoid',[['no text','no text, no watermarks, no captions'],['no deformed hands','no deformed hands, no extra fingers or limbs'],['no blur','no unwanted blur'],['no plastic skin','no plastic or airbrushed skin'],['no oversaturation','no oversaturated colors']])
]});
const COLS=[['Teal','#0f6e78'],['Orange','#e8892b'],['Amber Gold','#d9a441'],['Deep Navy Blue','#14233f'],['Steel Blue','#4a6d8c'],['Sky Blue','#7fb3d9'],['Crimson Red','#a3182b'],['Burgundy','#5a1022'],['Rust','#a6451f'],['Emerald Green','#1f7a53'],['Forest Green','#1c3b2a'],['Olive','#6b6b3a'],['Sage Green','#8fa58a'],['Mustard Yellow','#c9a227'],['Magenta','#c2187e'],['Neon Cyan','#19d4e6'],['Purple','#5b2a86'],['Pastel Pink','#e9a8b9'],['Cream White','#efe6d2'],['Sand Beige','#c7ad85'],['Warm Brown','#6b4326'],['Desaturated Grey','#7d8084'],['Charcoal','#2a2a2e'],['Black','#0b0b0d']];
const PRE=[['Teal & Orange','Teal','Deep Navy Blue','Orange'],['Golden warm','Amber Gold','Warm Brown','Cream White'],['Cold steel noir','Steel Blue','Charcoal','Desaturated Grey'],['Neon cyberpunk','Black','Magenta','Neon Cyan'],['Crimson thriller','Charcoal','Burgundy','Crimson Red'],['Matrix green','Forest Green','Black','Emerald Green'],['Pastel quirky','Pastel Pink','Sand Beige','Mustard Yellow'],['Desert dust','Sand Beige','Rust','Sky Blue']];
const COMP=['type','mood','char','act','item','logo','logoact','loc','aes','weather','time','light','cam','frame','lens','color','other','ratio','avoid'];
const LBL={type:'Type',mood:'Mood',char:'Character',act:'Action',item:'Item',logo:'Logo',logoact:'Logo treatment',loc:'Location',aes:'Aesthetic',weather:'Weather',time:'Time',light:'Lighting',cam:'Camera',frame:'Framing',lens:'Lens',color:'Color grade',other:'Details',ratio:'Format',avoid:'Avoid'};
let D,cur='type',slot='a',manual=false;
const KEY='wb13.pm';
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D||!D.cats)D=D0();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert('Brak miejsca w pamięci przeglądarki (zbyt duże obrazki?).')}};
const cat=id=>D.cats.find(c=>c.id===id),sel=id=>D.sel[id]||(D.sel[id]=[]);
const allItems=c=>c.g.flatMap(g=>g.it);
const findItem=(c,id)=>allItems(c).find(i=>i.id===id);
/* ---- składanie promptu ---- */
function descOf(c,it){const names=(D.sel.item||[]).map(id=>{const x=findItem(cat('item'),id);return x&&x.n}).filter(Boolean);
 let d=it.d.replace('{item}',names.length?names.join(' and '):'the product');if(it.img&&it.rf!==0)d+=' (match the attached reference image of '+it.n+')';return d}
function parts(){const out=[];COMP.forEach(id=>{const c=cat(id);if(!c)return;let p=[];
 if(c.k==='loc'){if(D.loc.trim())p=['set in '+D.loc.trim()]}
 else if(c.k==='color'){const g=D.cg,t=[];if(g.a)t.push(g.a.n+' ('+g.a.h+') dominant 60%');if(g.b)t.push(g.b.n+' ('+g.b.h+') secondary 30%');if(g.c)t.push(g.c.n+' ('+g.c.h+') accent 10%');if(t.length)p=[t.join('; ')]}
 else p=allItems(c).filter(i=>sel(id).includes(i.id)).map(i=>descOf(c,i));
 if(p.length)out.push([id,p])});return out}
function compose(){const P=parts(),ex=D.ex.trim();let t;
 if(D.fmt==='flat'){const av=P.find(x=>x[0]==='avoid'),main=P.filter(x=>x[0]!=='avoid').flatMap(x=>x[0]==='color'?x[1].map(s=>'color grade: '+s):x[1]);t=main.join(', ');if(av)t+=(t?'. ':'')+'Avoid: '+av[1].join(', ');if(ex)t+=(t?'. ':'')+ex}
 else{t=P.map(([id,p])=>LBL[id]+': '+p.join(', ')).join('\n');if(ex)t+=(t?'\n':'')+'Extra: '+ex}
 return t}
function renderOut(){if(!manual)$('#out').value=compose();const v=$('#out').value;$('#cnt').textContent=v.length+' chars · '+(v.trim()?v.trim().split(/\s+/).length:0)+' words'}
/* ---- UI ---- */
function dlg(title,build,btns){const o=E('div','dlg');o.innerHTML='<div class="ttl"></div><div class="bd"></div><div class="bt"></div>';o.firstChild.textContent=title;build(o.querySelector('.bd'));
 btns.forEach(([t,f,c])=>{const b=E('button','bn'+(c?' '+c:''),t);b.onclick=()=>{if(f&&f(o)===false)return;o.remove()};o.querySelector('.bt').append(b)});document.body.append(o);const i=o.querySelector('input,textarea');if(i)i.focus();
 o.onkeydown=e=>{if(e.key==='Escape')o.remove()};return o}
function ask(title,label,val,cb){let i;dlg(title,d=>{const l=E('label');l.append(E('i','',label));i=E('input');i.type='text';i.value=val||'';l.append(i);d.append(l);i.onkeydown=e=>{if(e.key==='Enter'){const v=i.value.trim();if(v){i.closest('.dlg').remove();cb(v)}}}},[['OK',()=>{const v=i.value.trim();if(!v)return false;cb(v)}],['Cancel']])}
function tabs(){const t=$('#tabs');t.replaceChildren(...D.cats.map(c=>{const n=c.k==='loc'?(D.loc.trim()?1:0):c.k==='color'?[D.cg.a,D.cg.b,D.cg.c].filter(Boolean).length:sel(c.id).length,b=E('div','tab'+(c.id===cur?' on':''),c.n);if(n)b.append(E('i','',n));b.onclick=()=>{cur=c.id;draw()};return b}));
 const p=E('div','tab','+');p.title='New category';p.onclick=()=>ask('New category','Name','',n=>{D.cats.push({id:uid(),n,k:'list',custom:1,g:[{n:'',it:[]}]});cur=D.cats[D.cats.length-1].id;save();draw()});t.append(p)}
function toggle(c,id){const s=sel(c.id),i=s.indexOf(id);if(i>=0)s.splice(i,1);else{if(c.s)s.length=0;s.push(id)}manual=false;save();draw()}
function itemDlg(c,g,it){const n=!it;let nm,ds,im=it&&it.img||null,rf=!it||it.rf!==0,pv,cb;
 dlg(n?'Add to '+c.n:'Edit: '+it.n,d=>{let l=E('label');l.append(E('i','','Name'));nm=E('input');nm.type='text';nm.value=n?'':it.n;l.append(nm);d.append(l);
  l=E('label');l.append(E('i','','Prompt description (what goes into the final prompt)'));ds=E('textarea');ds.rows=4;ds.value=n?'':it.d;l.append(ds);d.append(l);
  l=E('label');l.append(E('i','','Reference image (optional: product, character, logo)'));const fi=E('input');fi.type='file';fi.accept='image/*';pv=E('img');pv.style.cssText='display:block;margin-top:6px;max-width:90px;border:1px solid #f7fbf7;image-rendering:pixelated';if(im)pv.src=im;else pv.hidden=true;
  fi.onchange=()=>{const f=fi.files[0];if(!f)return;const m=new Image();m.onload=()=>{const s=Math.min(1,160/Math.max(m.width,m.height)),c2=document.createElement('canvas');c2.width=Math.round(m.width*s);c2.height=Math.round(m.height*s);c2.getContext('2d').drawImage(m,0,0,c2.width,c2.height);im=c2.toDataURL('image/jpeg',.75);pv.src=im;pv.hidden=false};m.src=URL.createObjectURL(f)};
  l.append(fi,pv);d.append(l);l=E('label');cb=E('input');cb.type='checkbox';cb.checked=rf;l.append(cb,E('span','',' mention the reference image in the prompt'));d.append(l)},
 [['Save',()=>{const name=nm.value.trim();if(!name)return false;const o={id:n?uid():it.id,n:name,d:ds.value.trim()||name,rf:cb.checked?1:0};if(im)o.img=im;if(n)g.it.push(o);else Object.assign(it,o,im?{}:{img:undefined});if(!im&&it)delete it.img;manual=false;save();draw()}],
  ...(n?[]:[['Delete',()=>{g.it.splice(g.it.indexOf(it),1);const s=sel(c.id),i=s.indexOf(it.id);if(i>=0)s.splice(i,1);manual=false;save();draw()},'d']]),['Cancel']])}
function paneList(c,p){const hd=E('div','ph');hd.append(E('b','',c.n));
 const bm=E('button','bn'+(c.s?' on':''),c.s?'Single':'Multi');bm.title='Selection mode';bm.onclick=()=>{c.s=c.s?0:1;if(c.s){const s=sel(c.id);s.length=Math.min(s.length,1)}manual=false;save();draw()};hd.append(bm);
 const clr=E('button','bn','Clear');clr.onclick=()=>{D.sel[c.id]=[];manual=false;save();draw()};hd.append(clr);
 if(c.grp){const ng=E('button','bn','+ Group');ng.onclick=()=>ask('New group','Group / session / project name','',n=>{c.g.push({n,it:[]});save();draw()});hd.append(ng)}
 else{const a=E('button','bn','+ Item');a.onclick=()=>itemDlg(c,c.g[0]);hd.append(a)}
 const rn=E('button','bn','Rename');rn.onclick=()=>ask('Rename category','Name',c.n,n=>{c.n=n;save();draw()});hd.append(rn);
 if(c.custom||c.grp){const dc=E('button','bn d','×');dc.title='Delete category';dc.onclick=()=>{if(confirm('Delete category '+c.n+'?')){D.cats.splice(D.cats.indexOf(c),1);delete D.sel[c.id];cur=D.cats[0].id;manual=false;save();draw()}};hd.append(dc)}
 p.append(hd);if(c.grp&&!c.g.length)p.append(E('div','dim','No groups yet — add one with “+ Group”.'));
 c.g.forEach(g=>{if(c.grp||g.n){const gh=E('div','gh');gh.append(E('span','',g.n||'—'));
   if(c.grp){const a=E('span','mini','+ Item');a.onclick=()=>itemDlg(c,g);const r=E('span','mini','✎');r.onclick=()=>ask('Rename group','Name',g.n,n=>{g.n=n;save();draw()});const x=E('span','mini','×');x.onclick=()=>{if(confirm('Delete group '+g.n+' with all its items?')){g.it.forEach(i=>{const s=sel(c.id),k=s.indexOf(i.id);if(k>=0)s.splice(k,1)});c.g.splice(c.g.indexOf(g),1);manual=false;save();draw()}};gh.append(a,r,x)}
   p.append(gh)}
  if(c.grp&&!g.it.length)p.append(E('div','dim','Empty group.'));
  g.it.forEach(it=>{const on=sel(c.id).includes(it.id),r=E('div','row'+(on?' on':''));r.append(E('div','cb'));
   if(it.img){const im=E('img');im.src=it.img;r.append(im)}
   const tx=E('div','tx');tx.append(E('b','',it.n),E('small','',it.d));r.append(tx);
   const ed=E('span','mini','✎');ed.onclick=e=>{e.stopPropagation();itemDlg(c,g,it)};r.append(ed);r.onclick=()=>toggle(c,it.id);p.append(r)})});
 if(c.grp)return;if(!c.g[0].it.length)p.append(E('div','dim','Empty — add your first item with “+ Item”.'))}
function paneLoc(c,p){const hd=E('div','ph');hd.append(E('b','',c.n));p.append(hd);const i=E('input');i.type='text';i.placeholder='city / country / planet … e.g. Kielce, Poland';i.value=D.loc;i.oninput=()=>{D.loc=i.value;manual=false;save();renderOut();tabs()};p.append(i,E('div','dim','Free text — added to the prompt as “set in …”.'))}
function paneColor(c,p){const hd=E('div','ph');hd.append(E('b','',c.n+' · 60 / 30 / 10'));const cl=E('button','bn','Clear');cl.onclick=()=>{D.cg={a:null,b:null,c:null};slot='a';manual=false;save();draw()};hd.append(cl);p.append(hd);
 const sl=E('div','slots');[['a','Dominant 60%'],['b','Secondary 30%'],['c','Accent 10%']].forEach(([k,t])=>{const s=E('div','slot'+(slot===k?' on':''));s.append(E('div','',t));const sw=E('s');if(D.cg[k])sw.style.background=D.cg[k].h;s.append(sw,E('span','',D.cg[k]?D.cg[k].n:'— pick —'));s.onclick=()=>{slot=k;draw()};sl.append(s)});p.append(sl);
 const pr=E('div','row2');pr.style.marginBottom='6px';PRE.forEach(([n,a,b,c3])=>{const f=x=>{const q=COLS.concat(D.cc||[]).find(z=>z[0]===x);return{n:q[0],h:q[1]}},bt=E('button','bn',n);bt.onclick=()=>{D.cg={a:f(a),b:f(b),c:f(c3)};manual=false;save();draw()};pr.append(bt)});p.append(pr);
 const tl=E('div','tiles');COLS.concat(D.cc||[]).forEach(([n,h])=>{const t=E('div','tile'),k=['a','b','c'].find(x=>D.cg[x]&&D.cg[x].n===n);if(k)t.classList.add('sel');const s=E('s');s.style.background=h;t.append(s,E('span','',n));if(k)t.append(E('em','',{a:'60%',b:'30%',c:'10%'}[k]));
  t.onclick=()=>{if(k===slot)D.cg[slot]=null;else{D.cg[slot]={n,h};const nx={a:'b',b:'c',c:'c'}[slot];if(!D.cg[nx]||nx===slot)slot=nx}manual=false;save();draw()};tl.append(t)});p.append(tl);
 const ad=E('button','bn','+ Custom color');ad.style.marginTop='6px';ad.onclick=()=>{let nm,hx;dlg('Custom color',d=>{let l=E('label');l.append(E('i','','Name'));nm=E('input');nm.type='text';l.append(nm);d.append(l);l=E('label');l.append(E('i','','Color'));hx=E('input');hx.type='color';hx.value='#c0392b';hx.style.cssText='width:60px;height:30px;padding:0';l.append(hx);d.append(l)},[['Add',()=>{if(!nm.value.trim())return false;(D.cc=D.cc||[]).push([nm.value.trim(),hx.value]);save();draw()}],['Cancel']])};p.append(ad)}
function draw(){tabs();const c=cat(cur)||D.cats[0],p=$('#pane');p.replaceChildren();if(c.k==='loc')paneLoc(c,p);else if(c.k==='color')paneColor(c,p);else paneList(c,p);renderVars();renderOut()}
/* ---- warianty ---- */
const snapState=()=>JSON.parse(JSON.stringify({sel:D.sel,loc:D.loc,cg:D.cg,ex:D.ex,fmt:D.fmt}));
function renderVars(){const v=$('#vars');v.replaceChildren();if(!D.vars.length){v.append(E('div','dim','No saved variants yet.'));return}
 D.vars.forEach(x=>{const r=E('div','v'),n=E('span','',x.n);n.title=x.t;n.onclick=()=>{const s=JSON.parse(JSON.stringify(x.st));D.sel=s.sel;D.loc=s.loc;D.cg=s.cg;D.ex=s.ex;D.fmt=s.fmt;$('#ex').value=D.ex;manual=false;save();syncFmt();draw()};
  const cp=E('span','mini','Copy');cp.onclick=()=>copy(x.t);const dl=E('span','mini','×');dl.onclick=()=>{if(confirm('Delete variant '+x.n+'?')){D.vars.splice(D.vars.indexOf(x),1);save();renderVars()}};r.append(n,cp,dl);v.append(r)})}
$('#bvar').onclick=()=>{const t=$('#out').value.trim();if(!t)return;ask('Save variant','Variant name','Variant '+(D.vars.length+1),n=>{D.vars.unshift({id:uid(),n,t,ts:Date.now(),st:snapState()});save();renderVars()})};
/* ---- przyciski ---- */
function copy(t){const done=()=>{const b=$('#bcopy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200)};
 const fb=()=>{const a=E('textarea');a.value=t;a.style.cssText='position:fixed;left:-999px';document.body.append(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}
$('#bcopy').onclick=()=>copy($('#out').value);
const dlf=(name,type,txt)=>{const a=E('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('#bsave').onclick=()=>dlf('prompt.txt','text/plain',$('#out').value);
function syncFmt(){$('#bfmt').textContent=D.fmt==='flat'?'Flat':'Labelled'}
$('#bfmt').onclick=()=>{D.fmt=D.fmt==='flat'?'lab':'flat';manual=false;save();syncFmt();renderOut()};
$('#breb').onclick=()=>{manual=false;renderOut()};
$('#bclr').onclick=()=>{if(confirm('Clear the whole selection?')){D.sel={};D.loc='';D.cg={a:null,b:null,c:null};D.ex='';$('#ex').value='';slot='a';manual=false;save();draw()}};
$('#out').oninput=()=>{manual=true;renderOut()};
$('#ex').oninput=e=>{D.ex=e.target.value;manual=false;save();renderOut()};
$('#bexp').onclick=()=>dlf('promptmaker-backup.json','application/json',JSON.stringify(D));
$('#bimp').onclick=()=>$('#fimp').click();
$('#fimp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.cats)throw 0;if(confirm('Replace all current data with the backup?')){D=o;save();location.reload()}}catch(x){alert('This is not a Prompt Maker backup file.')}});e.target.value=''};
$('#ex').value=D.ex||'';syncFmt();draw();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--b:#0055aa;--k:#00001c;--w:#f7fbf7;--o:#f38204;--m:ui-monospace,Menlo,Consolas,'Courier New',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--b);color:var(--w);font:8px/12px 'Press Start 2P',monospace;overflow:hidden}
#app{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:8px;height:100%;padding:8px}
@media(max-width:720px){#app{grid-template-columns:1fr;grid-template-rows:1fr 1fr;overflow:auto}}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;gap:6px}
.box{border:2px solid var(--w);padding:6px;min-height:0}
.ttl{background:var(--w);color:var(--k);padding:3px 6px;margin:-6px -6px 6px}
#tabs{display:flex;flex-wrap:wrap;gap:4px;flex:none}
.tab{padding:3px 5px;border:1px solid var(--w);cursor:pointer;white-space:nowrap}.tab.on{background:var(--w);color:var(--b)}
.tab i{font-style:normal;color:var(--o);margin-left:4px}.tab.on i{color:var(--k)}
#pane{flex:1;overflow:auto;scrollbar-color:var(--o) var(--b)}
.ph{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}.ph b{color:var(--o);font-weight:400;flex:1;min-width:80px}
.bn{border:1px solid var(--w);padding:3px 6px;cursor:pointer;white-space:nowrap;background:none;color:var(--w);font:inherit}.bn:active,.bn.on{background:var(--w);color:var(--b)}.bn.d{border-color:var(--o);color:var(--o)}
.gh{display:flex;gap:6px;align-items:center;margin:8px 0 4px;color:var(--o)}.gh>span:first-child{flex:1}
.row{display:flex;gap:6px;align-items:flex-start;padding:3px 2px;border-bottom:1px dotted rgba(247,251,247,.35);cursor:pointer}.row:hover{background:rgba(247,251,247,.1)}
.cb{flex:none;width:12px;height:12px;border:2px solid var(--w);margin-top:1px}.row.on .cb{background:var(--o);border-color:var(--w);box-shadow:inset 0 0 0 2px var(--k)}
.row .tx{flex:1;min-width:0}.row .tx b{font-weight:400}.row .tx small{display:block;font:11px/14px var(--m);opacity:.75;margin-top:2px;word-break:break-word}
.row img{width:40px;height:40px;object-fit:cover;border:1px solid var(--w);flex:none}
.mini{border:1px solid var(--w);padding:1px 4px;color:var(--w);cursor:pointer;flex:none}.mini:hover{background:var(--w);color:var(--b)}
input[type=text],textarea,select{font:12px/16px var(--m);background:var(--w);color:var(--k);border:2px solid var(--w);padding:4px 6px;width:100%;outline:0}
input:focus,textarea:focus{border-color:var(--o)}
#out{flex:1;min-height:90px;resize:none}
.row2{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slots{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.slot{flex:1;min-width:90px;border:2px dashed var(--w);padding:4px;cursor:pointer;text-align:center}.slot.on{border-style:solid;border-color:var(--o)}
.slot s{display:block;height:18px;margin:3px 0;border:1px solid var(--w);background:transparent}.slot span{display:block;font:11px/13px var(--m)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:5px}.tile{border:2px solid var(--w);cursor:pointer;text-align:center;padding:0 0 3px}.tile s{display:block;height:24px;margin-bottom:3px}.tile span{font:10px/12px var(--m);display:block}
.tile.sel{border-color:var(--o);box-shadow:0 0 0 2px var(--o)}.tile em{font-style:normal;color:var(--o);display:block}
#vars{max-height:96px;overflow:auto;scrollbar-color:var(--o) var(--b)}
.v{display:flex;gap:6px;align-items:center;padding:3px 0;border-bottom:1px dotted rgba(247,251,247,.35)}.v span:first-child{flex:1;cursor:pointer;font:11px/14px var(--m);word-break:break-word}.v span:first-child:hover{color:var(--o)}
.dlg{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:20;background:var(--b);border:2px solid var(--w);width:min(480px,94%);max-height:94%;overflow:auto;box-shadow:6px 6px 0 var(--k)}
.dlg .ttl{margin:0}.dlg .bd{padding:8px}.dlg label{display:block;margin-bottom:8px}.dlg label i{display:block;font-style:normal;margin-bottom:3px;color:var(--o)}
.dlg .bt{display:flex;gap:8px;justify-content:center;padding:0 8px 8px;flex-wrap:wrap}
.dim{opacity:.7;font:11px/14px var(--m)}
</style>
</head>
<body>
<div id="app">
  <div class="col">
    <div id="tabs"></div>
    <div class="box" id="pane" style="flex:1"></div>
  </div>
  <div class="col">
    <div class="box" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="ttl">Final prompt</div>
      <textarea id="out" spellcheck="false"></textarea>
      <div class="row2" style="margin-top:6px">
        <button class="bn" id="bcopy">Copy</button><button class="bn" id="bsave">Save .txt</button><button class="bn" id="bvar">Save variant</button>
        <button class="bn" id="bfmt">Flat</button><button class="bn" id="breb">Rebuild</button><button class="bn d" id="bclr">Clear all</button>
      </div>
      <input type="text" id="ex" placeholder="extra / own text added at the end…" style="margin-top:6px">
      <div class="dim" id="cnt" style="margin-top:4px"></div>
    </div>
    <div class="box" style="flex:none">
      <div class="ttl">Saved variants</div>
      <div id="vars"></div>
      <div class="row2" style="margin-top:6px"><button class="bn" id="bexp">Backup</button><button class="bn" id="bimp">Restore</button></div>
    </div>
  </div>
</div>
<input type="file" id="fimp" accept="application/json" hidden>

 const clr=E('button','bn','Clear');clr.onclick=()=>{D.sel[c.id]=[];manual=false;save();draw()};hd.append(clr);
 if(c.grp){const ng=E('button','bn','+ Group');ng.onclick=()=>ask('New group','Group / session / project name','',n=>{c.g.push({n,it:[]});save();draw()});hd.append(ng)}
 else{const a=E('button','bn','+ Item');a.onclick=()=>itemDlg(c,c.g[0]);hd.append(a)}
 const rn=E('button','bn','Rename');rn.onclick=()=>ask('Rename category','Name',c.n,n=>{c.n=n;save();draw()});hd.append(rn);
 if(c.custom||c.grp){const dc=E('button','bn d','×');dc.title='Delete category';dc.onclick=()=>{if(confirm('Delete category '+c.n+'?')){D.cats.splice(D.cats.indexOf(c),1);delete D.sel[c.id];cur=D.cats[0].id;manual=false;save();draw()}};hd.append(dc)}
 p.append(hd);if(pre)pre(p);listRows(c,p)}
function paneColor(c,p){const hd=E('div','ph');hd.append(E('b','',c.n+' · 60 / 30 / 10'));const cl=E('button','bn','Clear');cl.onclick=()=>{D.cg={a:null,b:null,c:null};slot='a';manual=false;save();draw()};hd.append(cl);p.append(hd);
 const sl=E('div','slots');[['a','Dominant 60%'],['b','Secondary 30%'],['c','Accent 10%']].forEach(([k,t])=>{const s=E('div','slot'+(slot===k?' on':''));s.append(E('div','',t));const sw=E('s');if(D.cg[k])sw.style.background=D.cg[k].h;s.append(sw,E('span','',D.cg[k]?D.cg[k].n:'— pick —'));s.onclick=()=>{slot=k;draw()};sl.append(s)});p.append(sl);
 const pr=E('div','row2');pr.style.marginBottom='6px';PRE.forEach(([n,a,b,c3])=>{const f=x=>{const q=COLS.concat(D.cc||[]).find(z=>z[0]===x);return{n:q[0],h:q[1]}},bt=E('button','bn',n);bt.onclick=()=>{D.cg={a:f(a),b:f(b),c:f(c3)};manual=false;save();draw()};pr.append(bt)});p.append(pr);
 const tl=E('div','tiles');COLS.concat(D.cc||[]).forEach(([n,h])=>{const t=E('div','tile'),k=['a','b','c'].find(x=>D.cg[x]&&D.cg[x].n===n);if(k)t.classList.add('sel');const s=E('s');s.style.background=h;t.append(s,E('span','',n));if(k)t.append(E('em','',{a:'60%',b:'30%',c:'10%'}[k]));
  t.onclick=()=>{if(k===slot)D.cg[slot]=null;else{D.cg[slot]={n,h};const nx={a:'b',b:'c',c:'c'}[slot];if(!D.cg[nx]||nx===slot)slot=nx}manual=false;save();draw()};tl.append(t)});p.append(tl);
 const ad=E('button','bn','+ Custom color');ad.style.marginTop='6px';ad.onclick=()=>{let nm,hx;dlg('Custom color',d=>{let l=E('label');l.append(E('i','','Name'));nm=E('input');nm.type='text';l.append(nm);d.append(l);l=E('label');l.append(E('i','','Color'));hx=E('input');hx.type='color';hx.value='#c0392b';hx.style.cssText='width:60px;height:30px;padding:0';l.append(hx);d.append(l)},[['Add',()=>{if(!nm.value.trim())return false;(D.cc=D.cc||[]).push([nm.value.trim(),hx.value]);save();draw()}],['Cancel']])};p.append(ad)}
function draw(){tabs();const c=cat(cur)||D.cats[0],p=$('#pane');p.replaceChildren();if(c.k==='color')paneColor(c,p);else if(c.k==='loc')paneList(c,p,pp=>{const i=E('input');i.type='text';i.placeholder='city / country / planet … e.g. Kielce, Poland';i.value=D.loc;i.oninput=()=>{D.loc=i.value;manual=false;save();renderOut();tabs()};pp.append(i,E('div','dim','Free text is added as “set in …”. Tick a saved place below to add a full scene description.'))});else paneList(c,p);renderVars();renderOut()}
/* ---- warianty ---- */
const snapState=()=>JSON.parse(JSON.stringify({sel:D.sel,loc:D.loc,cg:D.cg,ex:D.ex,fmt:D.fmt}));
function renderVars(){const v=$('#vars');v.replaceChildren();if(!D.vars.length){v.append(E('div','dim','No saved variants yet.'));return}
 D.vars.forEach(x=>{const r=E('div','v'),n=E('span','',x.n);n.title=x.t;n.onclick=()=>{const s=JSON.parse(JSON.stringify(x.st));D.sel=s.sel;D.loc=s.loc;D.cg=s.cg;D.ex=s.ex;D.fmt=s.fmt;$('#ex').value=D.ex;manual=false;save();syncFmt();draw()};
  const cp=E('span','mini','Copy');cp.onclick=()=>copy(x.t);const dl=E('span','mini','×');dl.onclick=()=>{if(confirm('Delete variant '+x.n+'?')){D.vars.splice(D.vars.indexOf(x),1);save();renderVars()}};r.append(n,cp,dl);v.append(r)})}
$('#bvar').onclick=()=>{const t=$('#out').value.trim();if(!t)return;ask('Save variant','Variant name','Variant '+(D.vars.length+1),n=>{D.vars.unshift({id:uid(),n,t,ts:Date.now(),st:snapState()});save();renderVars()})};
/* ---- przyciski ---- */
function copy(t){const done=()=>{const b=$('#bcopy');b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200)};
 const fb=()=>{const a=E('textarea');a.value=t;a.style.cssText='position:fixed;left:-999px';document.body.append(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb);else fb()}
$('#bcopy').onclick=()=>copy($('#out').value);
const dlf=(name,type,txt)=>{const a=E('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)};
$('#bsave').onclick=()=>dlf('prompt.txt','text/plain',$('#out').value);
function syncFmt(){$('#bfmt').textContent=D.fmt==='flat'?'Flat':'Labelled'}
$('#bfmt').onclick=()=>{D.fmt=D.fmt==='flat'?'lab':'flat';manual=false;save();syncFmt();renderOut()};
$('#breb').onclick=()=>{manual=false;renderOut()};
$('#bclr').onclick=()=>{if(confirm('Clear the whole selection?')){D.sel={};D.loc='';D.cg={a:null,b:null,c:null};D.ex='';$('#ex').value='';slot='a';manual=false;save();draw()}};
$('#out').oninput=()=>{manual=true;renderOut()};
$('#ex').oninput=e=>{D.ex=e.target.value;manual=false;save();renderOut()};
$('#bexp').onclick=()=>dlf('promptmaker-backup.json','application/json',JSON.stringify(D));
$('#bimp').onclick=()=>$('#fimp').click();
$('#fimp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!o.cats)throw 0;if(confirm('Replace all current data with the backup?')){D=o;save();location.reload()}}catch(x){alert('This is not a Prompt Maker backup file.')}});e.target.value=''};
$('#ex').value=D.ex||'';syncFmt();draw();
</script>
</body>
</html>
